name: Windows governance

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Keep submitted revisions queued instead of cancelling an active validation.
concurrency:
  group: windows-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        shell: pwsh
        run: |
          "registry=https://registry.npmjs.org/" | Set-Content .npmrc
          "replace-registry-host=always" | Add-Content .npmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run capabilities:check
      - name: Run command security parser shadow parity
        run: npm run test:security-shadow
      - run: npm run compile:frontend-ts

  unit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        shell: pwsh
        run: |
          "registry=https://registry.npmjs.org/" | Set-Content .npmrc
          "replace-registry-host=always" | Add-Content .npmrc
      - run: npm ci
      - name: Run unit gate with coverage
        shell: pwsh
        env:
          MY_CODE_AGENT_UNIT_MEMORY_MB: "4096"
          MY_CODE_AGENT_GATE_BUDGET_MB: "4096"
          MY_CODE_AGENT_COVERAGE_ENABLED: "1"
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE ".unit-output.txt"
          New-Item -ItemType File -Path $logPath -Force | Out-Null
          & npm run test:gates -- report unit 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Namespace unit coverage files
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .coverage/raw -Filter "*.json" |
            Rename-Item -NewName { "unit-$($_.Name)" }
      - name: Upload unit coverage
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          path: ${{ github.workspace }}/.coverage/raw
          if-no-files-found: error
      - name: Upload unit diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-output
          path: ${{ github.workspace }}/.unit-output.txt
          if-no-files-found: ignore

  routes:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        shell: pwsh
        run: |
          "registry=https://registry.npmjs.org/" | Set-Content .npmrc
          "replace-registry-host=always" | Add-Content .npmrc
      - run: npm ci
      - name: Run routes gate with coverage
        shell: pwsh
        env:
          MY_CODE_AGENT_GATE_BUDGET_MB: "2048"
          MY_CODE_AGENT_COVERAGE_ENABLED: "1"
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE ".routes-output.txt"
          New-Item -ItemType File -Path $logPath -Force | Out-Null
          & npm run test:gates -- report routes 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Namespace routes coverage files
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .coverage/raw -Filter "*.json" |
            Rename-Item -NewName { "routes-$($_.Name)" }
      - name: Upload routes coverage
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-routes
          path: ${{ github.workspace }}/.coverage/raw
          if-no-files-found: error
      - name: Upload routes diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: routes-test-output
          path: ${{ github.workspace }}/.routes-output.txt
          if-no-files-found: ignore

  frontend:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        shell: pwsh
        run: |
          "registry=https://registry.npmjs.org/" | Set-Content .npmrc
          "replace-registry-host=always" | Add-Content .npmrc
      - run: npm ci
      - run: npm run compile:frontend-ts
      - name: Run frontend gate with coverage
        shell: pwsh
        env:
          MY_CODE_AGENT_GATE_BUDGET_MB: "2048"
          MY_CODE_AGENT_COVERAGE_ENABLED: "1"
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE ".frontend-output.txt"
          New-Item -ItemType File -Path $logPath -Force | Out-Null
          & npm run test:gates -- report frontend 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Namespace frontend coverage files
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .coverage/raw -Filter "*.json" |
            Rename-Item -NewName { "frontend-$($_.Name)" }
      - name: Upload frontend coverage
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-frontend
          path: ${{ github.workspace }}/.coverage/raw
          if-no-files-found: error
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-test-output
          path: ${{ github.workspace }}/.frontend-output.txt
          if-no-files-found: ignore

  validate:
    needs: [preflight, unit, routes, frontend]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        shell: pwsh
        run: |
          "registry=https://registry.npmjs.org/" | Set-Content .npmrc
          "replace-registry-host=always" | Add-Content .npmrc
      - run: npm ci
      - name: Download coverage from parallel test jobs
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-*
          path: ${{ github.workspace }}/.coverage/raw
          merge-multiple: true
      - name: Run coverage aggregate
        run: node scripts/test-coverage.mjs
      - name: Build validated artifacts
        run: npm run build
      - name: Run build flow against validated artifacts
        shell: pwsh
        env:
          MY_CODE_AGENT_SKIP_BUILD: "1"
        run: npm run test:build
      - name: Upload build artifacts for packaged Electron
        uses: actions/upload-artifact@v6
        with:
          name: windows-build-${{ github.sha }}
          path: |
            dist
            dist-electron
          if-no-files-found: error

  packaged-electron:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        shell: pwsh
        run: |
          "registry=https://registry.npmjs.org/" | Set-Content .npmrc
          "replace-registry-host=always" | Add-Content .npmrc
      - run: npm ci
      - name: Download validated build artifacts
        uses: actions/download-artifact@v6
        with:
          name: windows-build-${{ github.sha }}
          path: .
      - run: node scripts/dist-dir.mjs --skip-build
      - run: npm run test:electron:e2e:run
        env:
          CI: "true"
          MY_CODE_AGENT_E2E_EMPTY_SHELL_BUDGET_MS: "5000"
          MY_CODE_AGENT_E2E_WORKBENCH_BUDGET_MS: "20000"
          MY_CODE_AGENT_E2E_EXIT_BUDGET_MS: "60000"
      - name: Upload packaged E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-electron-e2e-diagnostics
          path: .tmp-packaged-e2e-*/**
          if-no-files-found: ignore
