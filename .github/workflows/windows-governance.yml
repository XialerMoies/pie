name: Windows governance

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # package-lock.json 大部分 resolved URL 指向 npmmirror（本地生成），
      # GitHub runner 在美国拉国内镜像会超时。CI 强制用 npmjs 并重写 host。
      - name: Force default registry for CI
        run: |
          echo "registry=https://registry.npmjs.org/" > .npmrc
          echo "replace-registry-host=always" >> .npmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run capabilities:check
      - name: Run command security parser shadow parity
        run: npm run test:security-shadow
      # problems-bottom-bar 测试加载编译产物 src/frontend/gen/*.js（gitignore），
      # 需先 compile 生成 gen/，否则 npm test 阶段 ENOENT。
      - run: npm run compile:frontend-ts
      - name: Run blocking gates (capture output)
        shell: pwsh
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE ".test-output.txt"
          New-Item -ItemType File -Path $logPath -Force | Out-Null
          & npm run test:gates -- governance manifest profile-catalog report typecheck unit routes frontend css-vars replay agent-eval coverage build build-flow 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "blocking gates failed with exit code $exitCode"
            Get-Content -LiteralPath $logPath -Tail 240
            exit $exitCode
          }
      - name: Show failing test blocks
        if: failure()
        shell: pwsh
        run: |
          $logPath = Join-Path $env:GITHUB_WORKSPACE ".test-output.txt"
          if (-not (Test-Path -LiteralPath $logPath)) {
            "No blocking-gate output file was produced." | Set-Content -LiteralPath $logPath -Encoding utf8
          }
          $logItem = Get-Item -LiteralPath $logPath
          Write-Host "blocking-gate log: $($logItem.FullName) ($($logItem.Length) bytes)"
          Write-Host "---- blocking-gate log tail ----"
          Get-Content -LiteralPath $logPath -Tail 240
          Write-Host "---- gate failure summary ----"
          $gateFailures = Select-String -LiteralPath $logPath -Pattern '\[test-gates\] (finish .*status=(?!exit:0)|LIMIT |blocked at )'
          if ($gateFailures) { $gateFailures | Select-Object -First 100 }
          $runnerFailures = Select-String -LiteralPath $logPath -Pattern '\[(test-routes|test-suite|test-build)\].*(failed|exceeded|error|exit=)|Error:|AssertionError|ERR_ASSERTION'
          if ($runnerFailures) { $runnerFailures | Select-Object -First 100 }
          Write-Host "---- failing test blocks ----"
          $matches = Select-String -LiteralPath $logPath -Pattern '^not ok' -Context 0,18
          if ($matches) { $matches | Select-Object -First 400 }
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: npm-test-output
          path: ${{ github.workspace }}/.test-output.txt
      - name: Upload build artifacts for packaged Electron
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: windows-build-${{ github.sha }}
          path: |
            dist
            dist-electron
          if-no-files-found: error

  packaged-electron:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Force default registry for CI
        run: |
          echo "registry=https://registry.npmjs.org/" > .npmrc
          echo "replace-registry-host=always" >> .npmrc
      - run: npm ci
      - name: Download validated build artifacts
        uses: actions/download-artifact@v6
        with:
          name: windows-build-${{ github.sha }}
          path: .
      - run: node scripts/dist-dir.mjs --skip-build
      - run: npm run test:electron:e2e:run
        env:
          CI: "true"
          MY_CODE_AGENT_E2E_EMPTY_SHELL_BUDGET_MS: "5000"
          MY_CODE_AGENT_E2E_WORKBENCH_BUDGET_MS: "10000"
      - name: Upload packaged E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-electron-e2e-diagnostics
          path: .tmp-packaged-e2e-*/**
          if-no-files-found: ignore
